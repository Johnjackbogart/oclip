[workspace]
members = ["xtask"]
resolver = "2"

[package]
name = "oclip"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "An open-source clipper plugin (VST3/CLAP): gain, softness, and clip amount."
repository = "https://github.com/johnjackbogart/oclip"

[lib]
crate-type = ["cdylib", "lib"]

# Symbols kept temporarily (strip = "none", debug = true) so crash reports resolve real
# function names instead of raw offsets. Re-enable `strip = "symbols"` once the macOS GUI
# crash (see CLAUDE.md "Known issues") is understood/fixed.
[profile.release]
lto = "thin"
strip = "none"
debug = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[dependencies]
egui = "=0.35.0"
nice-plug = "0.2.3"
nice-plug-egui = "0.3.0"
rtrb = "0.3.4"

# Only used by `examples/editor_preview.rs`, a standalone dev harness that opens the editor UI in
# a plain window with no DAW/host — lets the GUI (and the baseview view/window machinery
# implicated in the macOS crash, see CLAUDE.md "Known issues") be exercised and debugged locally.
[dev-dependencies]
baseview = "0.2.2"
egui-baseview = "0.6.0"

# EXPERIMENTAL, not committed: local patch testing a fix for the macOS hit_test stack overflow
# (see CLAUDE.md "Known issues"). Remove before committing if this doesn't pan out.
[patch.crates-io]
baseview = { path = "/private/tmp/claude-502/-Users-jackbogart-r-dev-oclip/b5849912-cd1b-4984-a6e3-97a7e7447655/scratchpad/baseview-0.2.2-patched" }
