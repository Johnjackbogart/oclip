[workspace]
members = ["xtask"]
resolver = "2"

[package]
name = "openclip"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
description = "An open-source clipper plugin (VST3/CLAP): gain, softness, and clip amount."
repository = "https://github.com/johnjackbogart/oclip"

[lib]
crate-type = ["cdylib", "lib"]

# Symbols kept temporarily (strip = "none", debug = true) so crash reports resolve real
# function names instead of raw offsets. Re-enable `strip = "symbols"` once the macOS GUI
# crash (see CLAUDE.md "Known issues") is understood/fixed.
[profile.release]
lto = "thin"
strip = "none"
debug = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[dependencies]
egui = "=0.35.0"
nice-plug = "0.2.3"
nice-plug-egui = "0.3.0"
rtrb = "0.3.4"

# Only used by `examples/editor_preview.rs`, a standalone dev harness that opens the editor UI in
# a plain window with no DAW/host — lets the GUI (and the baseview view/window machinery
# implicated in the macOS crash, see CLAUDE.md "Known issues") be exercised and debugged locally.
[dev-dependencies]
baseview = "0.2.2"
egui-baseview = "0.6.0"

# Fix for the macOS `hit_test` stack-overflow crash (see CLAUDE.md "Known issues"): baseview's
# `hitTest:` override re-derives its NSView superclass via a live `this.view.class()` lookup on
# every call, which was returning the wrong class on macOS 26.6 and causing the override to
# recurse into itself until the stack overflowed. This fork hardcodes the statically-known
# `NSView::class()` instead, matching the superclass baseview itself already registers this view
# class with (see `src/wrappers/appkit/view/implementation.rs`). Verified: builds clean and no
# longer crashes on launch in `examples/editor_preview.rs`. Track for upstreaming to
# RustAudio/baseview; drop this patch once/if it lands there.
[patch.crates-io]
# Fix for the macOS `hit_test` stack-overflow crash (see CLAUDE.md "Known issues"). Root cause
# confirmed via lldb: at some point after window creation, AppKit installs a KVO observer on the
# view (isa-swizzling it to a synthetic `NSKVONotifying_BaseviewNSView_<uuid>` subclass). From
# then on, baseview's `hitTest:` override's `this.view.class().superclass()` no longer resolves to
# `NSView` — `.class()` returns the swizzled proxy, whose superclass is baseview's own registered
# class, not NSView. So `msg_send![super(...), hitTest:]` starts its method search at baseview's
# own class and calls the override again, forever. This fork hardcodes the statically-known
# `NSView::class()` instead, matching the superclass baseview itself already registers this view
# class with (see `src/wrappers/appkit/view/implementation.rs`), sidestepping the swizzled
# instance lookup entirely. Verified via examples/editor_preview.rs and lldb. Track for
# upstreaming to RustAudio/baseview; drop this patch once/if it lands there.
baseview = { git = "https://github.com/Johnjackbogart/baseview", branch = "fix_hit_test" }
